[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "authlib>=1.9.10",
    "cryptography<47",
    "fastapi[standard]>=0.162.0",
    "fastmcp>=4,<5",
    "httpx>=0.28.1",
    "langchain>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2.1.6",
]

[project.optional-dependencies]
gemini = [
    "langchain-google-genai>=4,<5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
